name: Deploy Front Porch Economics
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 6d42189fc4724a2d0ad8650b53814692

    steps:
      - uses: actions/checkout@v4

      - name: Apply D1 auth migration
        run: |
          set -euo pipefail

          add_column_if_missing() {
            local column="$1"
            local definition="$2"

            if npx wrangler d1 execute front-porch-economics --remote --command="SELECT ${column} FROM signups LIMIT 0;" >/dev/null 2>&1; then
              echo "Column ${column} already exists"
            else
              echo "Adding ${column} to signups"
              npx wrangler d1 execute front-porch-economics --remote --command="ALTER TABLE signups ADD COLUMN ${column} ${definition};"
            fi
          }

          add_column_if_missing pin_attempts "INTEGER NOT NULL DEFAULT 0"
          add_column_if_missing pin_requested_at "INTEGER"

      - name: Deploy Worker + Assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6d42189fc4724a2d0ad8650b53814692

      - name: Provision Worker secrets
        run: |
          echo "${{ secrets.JWT_SECRET }}"          | npx wrangler secret put JWT_SECRET
          echo "${{ secrets.TWILIO_ACCOUNT_SID }}"  | npx wrangler secret put TWILIO_ACCOUNT_SID
          echo "${{ secrets.TWILIO_AUTH_TOKEN }}"   | npx wrangler secret put TWILIO_AUTH_TOKEN
          echo "${{ secrets.TWILIO_FROM_NUMBER }}"  | npx wrangler secret put TWILIO_FROM_NUMBER
