name: Deploy Front Porch Economics
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 6d42189fc4724a2d0ad8650b53814692

    steps:
      - uses: actions/checkout@v4

      - name: Apply D1 auth migration
        run: |
          set -euo pipefail

          add_column_if_missing() {
            local column="$1"
            local definition="$2"

            if npx wrangler d1 execute front-porch-economics --remote --command="SELECT ${column} FROM signups LIMIT 0;" >/dev/null 2>&1; then
              echo "Column ${column} already exists"
            else
              echo "Adding ${column} to signups"
              npx wrangler d1 execute front-porch-economics --remote --command="ALTER TABLE signups ADD COLUMN ${column} ${definition};"
            fi
          }

          add_column_if_missing pin_attempts "INTEGER NOT NULL DEFAULT 0"
          add_column_if_missing pin_requested_at "INTEGER"
          add_column_if_missing webauthn_challenge "TEXT"
          add_column_if_missing webauthn_challenge_exp "INTEGER"
          add_column_if_missing enrollment_token "TEXT"
          add_column_if_missing enrollment_token_exp "INTEGER"

          # Create passkey_credentials table if it does not exist
          npx wrangler d1 execute front-porch-economics --remote --command="CREATE TABLE IF NOT EXISTS passkey_credentials (credential_id TEXT PRIMARY KEY, email TEXT NOT NULL, public_key TEXT NOT NULL, sign_count INTEGER NOT NULL DEFAULT 0, transports TEXT, created_at INTEGER NOT NULL); CREATE INDEX IF NOT EXISTS idx_passkey_email ON passkey_credentials (email);"

          # Create profiles table if it doesn't exist yet
          npx wrangler d1 execute front-porch-economics --remote --command="CREATE TABLE IF NOT EXISTS profiles (email TEXT PRIMARY KEY, wealth_priorities TEXT, barrier_type TEXT, barrier_detail TEXT, community_assets TEXT, trusted_spaces TEXT, tech_preference TEXT, vision_10yr TEXT, one_change TEXT, updated_at INTEGER);"

      - name: Deploy Worker + Assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6d42189fc4724a2d0ad8650b53814692

      - name: Provision Worker secrets
        run: |
          echo "${{ secrets.JWT_SECRET }}" | npx wrangler secret put JWT_SECRET
