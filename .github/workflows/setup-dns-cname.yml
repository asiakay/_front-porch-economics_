name: Add DNS CNAME for admin subdomain
on:
  workflow_dispatch:

jobs:
  add-cname:
    name: Create CNAME record
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ZONE_NAME: "frontporcheconomics.org"
      RECORD_NAME: "admin"
      RECORD_TARGET: "front-porch-economics.pages.dev"
      API: "https://api.cloudflare.com/client/v4"

    steps:
      - name: Look up Zone ID
        id: zone
        run: |
          RESPONSE=$(curl -s "${API}/zones?name=${ZONE_NAME}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")

          echo "$RESPONSE" | jq .
          ZONE_ID=$(echo "$RESPONSE" | jq -r '.result[0].id // empty')

          if [[ -z "$ZONE_ID" ]]; then
            echo "::error::Zone not found — check that ${ZONE_NAME} is in this Cloudflare account"
            exit 1
          fi

          echo "zone_id=${ZONE_ID}" >> "$GITHUB_OUTPUT"
          echo "Zone ID: ${ZONE_ID}"

      - name: Create CNAME record
        run: |
          ZONE_ID="${{ steps.zone.outputs.zone_id }}"
          RESPONSE=$(curl -s -X POST "${API}/zones/${ZONE_ID}/dns_records" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{
              "type": "CNAME",
              "name": "'"${RECORD_NAME}"'",
              "content": "'"${RECORD_TARGET}"'",
              "proxied": true,
              "ttl": 1,
              "comment": "Admin subdomain protected by Cloudflare Access"
            }')

          echo "$RESPONSE" | jq .
          SUCCESS=$(echo "$RESPONSE" | jq -r '.success')

          if [[ "$SUCCESS" != "true" ]]; then
            echo "::error::Failed to create DNS record"
            exit 1
          fi

          echo "CNAME created: ${RECORD_NAME}.${ZONE_NAME} -> ${RECORD_TARGET} (proxied)"

      - name: Summary
        run: |
          echo "### DNS record added" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Type | CNAME |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Name | \`${RECORD_NAME}.${ZONE_NAME}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Target | \`${RECORD_TARGET}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Proxied | yes (orange cloud) |" >> "$GITHUB_STEP_SUMMARY"
