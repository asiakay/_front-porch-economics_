name: Add DNS CNAME for admin subdomain
on:
  workflow_dispatch:

jobs:
  add-cname:
    name: Create CNAME record
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ZONE_NAME: "frontporcheconomics.org"
      RECORD_NAME: "admin"
      RECORD_TARGET: "front-porch-economics.pages.dev"
      API: "https://api.cloudflare.com/client/v4"

    steps:
      - name: Look up Zone ID
        id: zone
        run: |
          RESPONSE=$(curl -s "${API}/zones?name=${ZONE_NAME}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")

          echo "$RESPONSE" | python3 -m json.tool
          ZONE_ID=$(echo "$RESPONSE" | python3 -c "
import sys, json
d = json.load(sys.stdin)
results = d.get('result', [])
if not results:
    raise SystemExit('Zone not found — check that frontporcheconomics.org is in this Cloudflare account')
print(results[0]['id'])
")
          echo "zone_id=${ZONE_ID}" >> "$GITHUB_OUTPUT"
          echo "Zone ID: ${ZONE_ID}"

      - name: Create CNAME record
        run: |
          ZONE_ID="${{ steps.zone.outputs.zone_id }}"
          RESPONSE=$(curl -s -X POST "${API}/zones/${ZONE_ID}/dns_records" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{
              "type": "CNAME",
              "name": "'"${RECORD_NAME}"'",
              "content": "'"${RECORD_TARGET}"'",
              "proxied": true,
              "ttl": 1,
              "comment": "Admin subdomain protected by Cloudflare Access"
            }')

          echo "$RESPONSE" | python3 -m json.tool
          SUCCESS=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('success',''))")
          if [[ "$SUCCESS" != "True" ]]; then
            echo "::error::Failed to create DNS record"
            exit 1
          fi

          echo "CNAME created: ${RECORD_NAME}.${ZONE_NAME} → ${RECORD_TARGET} (proxied)"

      - name: Summary
        run: |
          echo "### DNS record added" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Type | CNAME |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Name | \`${RECORD_NAME}.${ZONE_NAME}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Target | \`${RECORD_TARGET}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Proxied | yes (orange cloud) |" >> "$GITHUB_STEP_SUMMARY"
